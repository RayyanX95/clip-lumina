<!DOCTYPE html>
<html>
<head>
<style>
  body { 
    margin: 0; 
    background: #94a3b8; /* Medium Slate Gray - Readable base for black text */
    width: 660px; 
    height: 400px; 
    overflow: hidden; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
  }

  .bg {
    width: 660px;
    height: 400px;
    /* Frosted App Theme: Mixes brand-bg-surface and brand-primary in a lightened state */
    background: #cbd5e1;
    background:
      radial-gradient(circle at 180px 170px, #e2e8f0 0%, #cbd5e1 55%),
      radial-gradient(circle at 480px 170px, #e2e8f0 0%, #cbd5e1 55%);
    position: relative;
    color: #0f172a; /* brand-bg for visibility */
  }

  /* Core App Theme Accents - Shifted to more "Frosted" shades of the brand colors */
  .accent {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.2;
    pointer-events: none;
    z-index: 0;
  }
  .accent-primary {
    top: -150px;
    left: -100px;
    background: #3b82f6; /* brand-primary */
  }
  .accent-secondary {
    bottom: -150px;
    right: -100px;
    background: #6366f1; /* brand-secondary */
  }
  .accent-cyan {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    background: #22d3ee; /* brand-accent */
    opacity: 0.1;
  }

  /* Subtle Folder Design Target */
  .applications-target {
    position: absolute;
    left: 410px;
    top: 100px;
    width: 140px;
    height: 140px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
  }

  .folder-icon {
    width: 70px;
    height: 52px;
    /* Uses brand-bg-surface for the folder base */
    background: linear-gradient(
      135deg,
      rgba(30, 41, 59, 0.2) 0%,
      rgba(30, 41, 59, 0.1) 100%
    );
    border: 1px solid rgba(30, 41, 59, 0.3);
    border-radius: 12px;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }

  .folder-icon::before {
    content: '';
    position: absolute;
    top: -8px;
    left: 4px;
    width: 28px;
    height: 10px;
    background: rgba(30, 41, 59, 0.2);
    border-radius: 4px 4px 0 0;
  }

  .folder-icon::after {
    content: 'A';
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    font-weight: 800;
    color: rgba(30, 41, 59, 0.3);
    letter-spacing: -1px;
  }

  /* Refined Modern Arrow using brand-primary-strong */
  .arrow {
    position: absolute;
    left: 300px;
    top: 168px;
    width: 60px;
    height: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  .arrow-line {
    width: 45px;
    height: 2px;
    background: linear-gradient(to right, transparent, rgba(37, 99, 235, 0.3), transparent);
  }

  .arrow-head {
    width: 12px;
    height: 12px;
    border-top: 2px solid rgba(37, 99, 235, 0.3);
    border-right: 2px solid rgba(37, 99, 235, 0.3);
    transform: rotate(45deg);
    margin-left: -10px;
  }

  /* Clean Helper Text using brand-bg-deep */
  .guide-text {
    position: absolute;
    bottom: 60px;
    width: 100%;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #020617;
    opacity: 0.3;
    z-index: 1;
  }
</style>
</head>

<body>
  <div class="bg" id="dmg-bg">
     <div class="accent accent-primary"></div>
     <div class="accent accent-secondary"></div>
     <div class="accent accent-cyan"></div>
     
     <div class="applications-target">
        <div class="folder-icon"></div>
     </div>

     <div class="arrow">
        <div class="arrow-line"></div>
        <div class="arrow-head"></div>
     </div>

     <div class="guide-text">Drag to Install</div>
  </div>
</body>
</html>
