<!DOCTYPE html>
<html>
<head>
<style>
  body { 
    margin: 0; 
    background: #05050a; 
    width: 660px; 
    height: 400px; 
    overflow: hidden; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
  }
  .bg {
    width: 660px;
    height: 400px;
    background: #080812;
    background: radial-gradient(circle at 180px 170px, #1a1a3a 0%, #080812 40%),
                radial-gradient(circle at 480px 170px, #1a1a3a 0%, #080812 40%);
    position: relative;
    color: white;
  }
  
  /* Subtle Folder Design Target */
  .applications-target {
    position: absolute;
    left: 410px;
    top: 100px;
    width: 140px;
    height: 140px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  .folder-icon {
    width: 70px;
    height: 52px;
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    position: relative;
  }
  .folder-icon::before {
    content: '';
    position: absolute;
    top: -6px;
    left: 4px;
    width: 24px;
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px 4px 0 0;
  }
  .folder-icon::after {
    content: 'A';
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: 900;
    color: rgba(255,255,255,0.1);
  }

  /* Simple Arrow */
  .arrow {
    position: absolute;
    left: 310px;
    top: 165px;
    width: 40px;
    height: 10px;
    display: flex;
    align-items: center;
  }
  .arrow-line {
    width: 30px;
    height: 2px;
    background: rgba(255,255,255,0.2);
  }
  .arrow-head {
    width: 10px;
    height: 10px;
    border-top: 2px solid rgba(255,255,255,0.2);
    border-right: 2px solid rgba(255,255,255,0.2);
    transform: rotate(45deg);
    margin-left: -6px;
  }

  /* Clean Helper Text */
  .guide-text {
    position: absolute;
    bottom: 40px;
    width: 100%;
    text-align: center;
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 4px;
    opacity: 0.3;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="bg" id="dmg-bg">
     <div class="applications-target">
        <div class="folder-icon"></div>
     </div>
     
     <div class="arrow">
        <div class="arrow-line"></div>
        <div class="arrow-head"></div>
     </div>

     <div class="guide-text">Drag to Applications</div>
  </div>
</body>
</html>
