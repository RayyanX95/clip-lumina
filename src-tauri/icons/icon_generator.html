<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      .icon-container {
        width: 1024px;
        height: 1024px;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        border-radius: 220px; /* Scaled macOS Squircle approximation */
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        box-shadow:
          inset 0 0 40px rgba(255, 255, 255, 0.05),
          0 40px 80px rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }
      /* Subtle Glass Highlight */
      .icon-container::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1) 0%,
          transparent 70%
        );
        pointer-events: none;
      }
      .clipboard {
        width: 480px;
        height: 600px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 40px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .clipboard-top {
        width: 200px;
        height: 60px;
        background: #333;
        position: absolute;
        top: -30px;
        border-radius: 16px;
      }
      /* The "Lumina" Rings */
      .rings {
        position: absolute;
        width: 320px;
        height: 320px;
        opacity: 0.9;
      }
      .ring {
        position: absolute;
        border-radius: 50%;
        border: 36px solid transparent;
      }
      .cyan {
        width: 200px;
        height: 200px;
        border-color: #00d2ff;
        top: 20px;
        left: 20px;
        box-shadow: 0 0 60px rgba(0, 210, 255, 0.6);
        filter: drop-shadow(0 0 20px #00d2ff);
      }
      .amber {
        width: 200px;
        height: 200px;
        border-color: #ffb400;
        bottom: 20px;
        right: 20px;
        box-shadow: 0 0 60px rgba(255, 180, 0, 0.6);
        filter: drop-shadow(0 0 20px #ffb400);
      }
    </style>
  </head>
  <body>
    <div class="icon-container" id="icon">
      <div class="clipboard">
        <div class="clipboard-top"></div>
        <div class="rings">
          <div
            class="ring cyan"
            style="clip-path: polygon(0 0, 100% 0, 100% 60%, 0 60%)"
          ></div>
          <div
            class="ring amber"
            style="clip-path: polygon(0 40%, 100% 40%, 100% 100%, 0 100%)"
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
